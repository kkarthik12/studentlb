name: build-and-deploy
on:
  push:
    branches: [main]

permissions:
  id-token: write
  contents: read

env:
  ACR_NAME: studentlb
  RG: react-rg

jobs:
  build-push:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}
      - run: az acr login -n $ACR_NAME
      - name: Build and push
        run: |
          B=$ACR_NAME.azurecr.io/student-portal-backend:${{ github.sha }}
          F=$ACR_NAME.azurecr.io/student-portal-frontend:${{ github.sha }}
          docker build -t $B ./backend
          docker build -t $F ./frontend
          docker push $B
          docker push $F

  deploy:
    needs: build-push
    runs-on: ubuntu-latest
    steps:
      - uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}
      - name: Rolling deploy, one VM at a time
        run: |
          for VM in karthik-app-vm1 karthik-app-vm2; do
            echo "Deploying to $VM"
            az vm run-command invoke -g $RG -n $VM \
              --command-id RunShellScript \
              --scripts "/opt/portal/deploy.sh ${{ github.sha }}" \
              --query "value[0].message" -o tsv | tee out.txt
            grep -q DEPLOY_OK out.txt
          done